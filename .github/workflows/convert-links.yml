name: Update Blender GitHub navigation mirror
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: blender-browse
  cancel-in-progress: false
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blender-only
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Convert public notes only
        run: node scripts/convert-wikilinks.mjs .
      - name: Publish without rewriting mirror history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          tree=$(git write-tree)
          parent=$(git rev-parse HEAD)
          if git show-ref --verify --quiet refs/remotes/origin/blender-only-browse; then
            parent=$(git rev-parse refs/remotes/origin/blender-only-browse)
          fi
          commit=$(printf '%s\n' 'docs: update Blender navigation mirror' | git commit-tree "$tree" -p "$parent")
          git push origin "$commit:refs/heads/blender-only-browse"
